name: Push docker images

on:
  push:
    branches:
      - main

jobs:
  push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build src/backend --tag backend

      - name: Build frontend image
        run: |
          sed -i 's!ws://localhost:8000!wss://killordie.mooo.com!g' src/frontend/.env.example
          sed -i 's!http://localhost:8000!https://killordie.mooo.com!g' src/frontend/.env.example
          docker build src/frontend --tag frontend
        

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to Github Packages
        run: |
          ORG_ADDRESS=ghcr.io/acts-se-2026

          docker tag backend $ORG_ADDRESS/the-game-backend:latest
          docker push $ORG_ADDRESS/the-game-backend:latest

          docker tag frontend $ORG_ADDRESS/the-game-frontend:latest
          docker push $ORG_ADDRESS/the-game-frontend:latest

      - name: Connect to the server
        run: |
          mkdir -p /home/runner/.ssh
          ssh-keyscan killordie.mooo.com >> /home/runner/.ssh/known_hosts
          echo "${{ secrets.SSH_KEY }}" > /home/runner/.ssh/id_ed25519
          chmod 600 /home/runner/.ssh/id_ed25519
          ssh dev@killordie.mooo.com "echo HELLO > hello.txt"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh dev@killordie.mooo.com "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

          ssh dev@killordie.mooo.com "docker compose down && docker system prune"
          scp docker-compose.yml dev@killordie.mooo.com:/home/dev/
          ssh dev@killordie.mooo.com "docker compose up -d"
