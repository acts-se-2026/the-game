name: Push docker images

on:
  push:
    branches:
      - ci/push-containers

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build src/backend --tag backend

      - name: Build frontend image
        run: docker build src/frontend --tag frontend

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to Github Packages
        run: |
          ORG_ADDRESS=ghcr.io/acts-se-2026

          docker tag backend $ORG_ADDRESS/the-game-backend:latest
          docker push $ORG_ADDRESS/the-game-backend:latest

          docker tag frontend $ORG_ADDRESS/the-game-frontend:latest
          docker push $ORG_ADDRESS/the-game-frontend:latest
