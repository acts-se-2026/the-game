services:
  frontend:
    image: ghcr.io/acts-se-2026/the-game-frontend:latest
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "443:443/udp"
    
    volumes:
      - caddy_data:/data
      - caddy_config:/config
  
 
  backend:
    image: ghcr.io/acts-se-2026/the-game-backend:latest
    restart: unless-stopped

    volumes:
      - .env.backend:/build/.env
  
  volumes:
    caddy_data:
    caddy_config:
      
      
